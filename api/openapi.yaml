openapi: 3.1.0
info:
  title: Book Worm E-Bookstore API
  version: 1.0.0
  description: |
    REST API for the Book Worm e-bookstore: catalogue, cart, checkout, payments and orders.

    * Catalogue endpoints are public. Everything under `/me` and `/orders` requires an OpenID Connect access token.
    * Money values are RON (Romanian leu) amounts as JSON numbers with at most two decimals.
    * Card details are **never** sent to this API. The browser tokenises them with the payment gateway and
      sends only the resulting `paymentToken`.
    * Errors use RFC 9457 problem details with generic messages. Internal details are logged server-side only.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development (loopback only; plain HTTP is a documented development exception)
  - url: https://127.0.0.1:8443/api/v1
    description: Local development with TLS (set TLS_KEY_FILE and TLS_CERT_FILE)
tags:
  - { name: Catalogue, description: 'Browse categories, writers and books' }
  - { name: Reviews, description: 'Ratings and reviews of books' }
  - { name: Account, description: 'Profile, addresses, wallet and recommendations' }
  - { name: Cart, description: 'The shopping basket' }
  - { name: Wishlist, description: 'Books saved for later' }
  - { name: Writers, description: 'Followed writers' }
  - { name: Checkout, description: 'Price quotes with VAT, delivery, coupons and gift points' }
  - { name: Orders, description: 'Order history, cancellation and Buy It Again' }
  - { name: Payments, description: 'Paying for an order' }

security:
  - oidc: [openid, profile, email]

paths:
  /categories:
    get:
      tags: [Catalogue]
      operationId: listCategories
      summary: List book categories
      security: []
      responses:
        '200':
          description: All categories in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /authors:
    get:
      tags: [Catalogue]
      operationId: listAuthors
      summary: List writers
      security: []
      responses:
        '200':
          description: All writers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Author' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /authors/{authorId}:
    get:
      tags: [Catalogue]
      operationId: getAuthor
      summary: Get a writer with the books they have written
      security: []
      parameters:
        - { $ref: '#/components/parameters/AuthorId' }
      responses:
        '200':
          description: The writer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /books:
    get:
      tags: [Catalogue]
      operationId: searchBooks
      summary: Search and filter the catalogue
      security: []
      parameters:
        - name: q
          in: query
          description: Free-text search over title and subtitle
          schema: { type: string, maxLength: 100 }
        - name: category
          in: query
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        - name: author
          in: query
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        - name: language
          in: query
          schema: { type: string, maxLength: 40 }
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/BookFormat' }
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, rating, newest]
            default: relevance
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: A page of books
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }

  /books/bestsellers:
    get:
      tags: [Catalogue]
      operationId: listBestsellers
      summary: Bestsellers this month
      security: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/BookList' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /books/new-launches:
    get:
      tags: [Catalogue]
      operationId: listNewLaunches
      summary: Newly published books
      security: []
      parameters:
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/BookList' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        default: { $ref: '#/components/responses/Error' }

  /books/{bookId}:
    get:
      tags: [Catalogue]
      operationId: getBook
      summary: Get a book, including its tentative delivery estimate
      security: []
      parameters:
        - { $ref: '#/components/parameters/BookId' }
      responses:
        '200':
          description: The book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /books/{bookId}/related:
    get:
      tags: [Catalogue]
      operationId: listRelatedBooks
      summary: Related reads (same category or writer)
      security: []
      parameters:
        - { $ref: '#/components/parameters/BookId' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/BookList' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /books/{bookId}/reviews:
    parameters:
      - { $ref: '#/components/parameters/BookId' }
    get:
      tags: [Reviews]
      operationId: listReviews
      summary: List reviews for a book
      security: []
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: A page of reviews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Review a book (one review per user per book)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Current user profile with wallet balance and gift points
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /me/recommendations:
    get:
      tags: [Account]
      operationId: listRecommendations
      summary: Recommendations based on the user's order history
      description: Falls back to top-rated books when the user has no history.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/BookList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /me/addresses:
    get:
      tags: [Account]
      operationId: listAddresses
      summary: Saved delivery addresses
      responses:
        '200':
          description: Saved addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Account]
      operationId: createAddress
      summary: Save a delivery address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Address saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /me/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    put:
      tags: [Account]
      operationId: updateAddress
      summary: Update a saved address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Account]
      operationId: deleteAddress
      summary: Delete a saved address
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /me/wallet/transactions:
    get:
      tags: [Account]
      operationId: listWalletTransactions
      summary: Wallet ledger
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: A page of wallet transactions
          content:
            application/json:
              schema:
                type: object
                required: [items, balance]
                properties:
                  balance: { $ref: '#/components/schemas/Money' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WalletTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /me/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Get the cart
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: Empty the cart
      responses:
        '204': { description: Cart emptied }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /me/cart/items/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    put:
      tags: [Cart]
      operationId: setCartItem
      summary: Add a book to the cart or change its quantity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              additionalProperties: false
              properties:
                quantity: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Remove a book from the cart
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /me/wishlist:
    get:
      tags: [Wishlist]
      operationId: getWishlist
      summary: Wishlist
      responses:
        '200': { $ref: '#/components/responses/BookList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /me/wishlist/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    put:
      tags: [Wishlist]
      operationId: addToWishlist
      summary: Add a book to the wishlist (idempotent)
      responses:
        '204': { description: In wishlist }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Wishlist]
      operationId: removeFromWishlist
      summary: Remove a book from the wishlist (idempotent)
      responses:
        '204': { description: Not in wishlist }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /me/writers:
    get:
      tags: [Writers]
      operationId: listFollowedWriters
      summary: Writers the user follows
      responses:
        '200':
          description: Followed writers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Author' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /me/writers/{authorId}:
    parameters:
      - $ref: '#/components/parameters/AuthorId'
    put:
      tags: [Writers]
      operationId: followWriter
      summary: Follow a writer (idempotent)
      responses:
        '204': { description: Following }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Writers]
      operationId: unfollowWriter
      summary: Unfollow a writer (idempotent)
      responses:
        '204': { description: Not following }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /checkout/quote:
    post:
      tags: [Checkout]
      operationId: quoteCheckout
      summary: Price the current cart
      description: |
        Calculates subtotal, VAT, delivery charge and discounts for the cart without creating an order.
        An invalid or ineligible coupon is reported in `couponError`, not as an HTTP error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: The price breakdown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }

  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Order history
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: A page of orders, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order from the cart
      description: |
        Creates an order in `pending_payment` status, reserving stock and the gift points to redeem.
        Pay for it with `POST /orders/{orderId}/payments`. Unpaid orders expire automatically.
        Send an `Idempotency-Key` header to make retries safe.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /orders/{orderId}/payments:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Payments]
      operationId: payOrder
      summary: Pay for an order
      description: |
        On success the order moves to `placed`, the 48-hour cancellation window starts, and earned gift points
        are credited. A failed attempt leaves the order in `pending_payment` so another method can be tried.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        '201':
          description: Payment attempt recorded (check `status`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        default: { $ref: '#/components/responses/Error' }

  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order within 48 hours of purchase
      description: |
        Allowed while the order is `placed` and `cancellableUntil` is in the future: the amount paid is refunded
        to the wallet (cash-on-delivery orders have nothing to refund), redeemed gift points are restored and the
        points earned are taken back. An order still in `pending_payment` can be cancelled at any time to release
        its reserved stock and gift points. Otherwise responds 409.
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /orders/{orderId}/buy-again:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: buyAgain
      summary: Add every book of a past order to the cart ("Buy It Again")
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: http://127.0.0.1:9000/.well-known/openid-configuration
      description: OpenID Connect access token (JWT) sent as `Authorization Bearer`. Tokens are validated on every request.

  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', example: joy-of-minimalism }
    AuthorId:
      name: authorId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', example: daniel-reed }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 16, maxLength: 64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 24, default: 3 }

  responses:
    BookList:
      description: A list of books
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Book' }
    Cart:
      description: The cart
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Cart' }
    Error:
      description: Unexpected error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The request conflicts with the current state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: The request is valid but cannot be processed (e.g. empty cart, out of stock)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. `detail` is always a generic, user-safe message.
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Invalid request }
        status: { type: integer, example: 400 }
        detail: { type: string }
        errors:
          type: array
          description: Per-field validation errors
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: postalCode }
              message: { type: string, example: Enter a 6-digit postal code }

    Money:
      type: number
      multipleOf: 0.01
      minimum: 0
      example: 149

    BookFormat:
      type: string
      enum: [Paperback, Hardcover, eBook]

    Category:
      type: object
      required: [id, label]
      properties:
        id: { type: string, example: self-help }
        label: { type: string, example: Self-help }

    Author:
      type: object
      required: [id, name, bio]
      properties:
        id: { type: string, example: daniel-reed }
        name: { type: string, example: Daniel Reed }
        bio: { type: string }

    AuthorDetail:
      allOf:
        - $ref: '#/components/schemas/Author'
        - type: object
          required: [books]
          properties:
            books:
              type: array
              items: { $ref: '#/components/schemas/Book' }

    Book:
      type: object
      required: [id, title, subtitle, author, publisher, categoryId, tags, format, price, language, rating, copiesSold, publishedAt, isbn, estimatedDelivery]
      properties:
        id: { type: string, example: joy-of-minimalism }
        title: { type: string, example: Joy of Minimalism }
        subtitle: { type: string, example: 'Declutter your life to uncover peace, clarity, and joy.' }
        author:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        publisher: { type: string, example: ABC Publishers }
        categoryId: { type: string, example: self-help }
        tags:
          type: array
          items: { type: string }
          example: [Non-fiction, Self Help]
        format: { $ref: '#/components/schemas/BookFormat' }
        price: { $ref: '#/components/schemas/Money' }
        language: { type: string, example: English }
        rating: { type: number, minimum: 0, maximum: 5, example: 4.6 }
        ratingCount: { type: integer, minimum: 0 }
        copiesSold: { type: integer, minimum: 0, example: 145 }
        publishedAt: { type: string, format: date }
        isbn: { type: string }
        inStock: { type: boolean, description: Always true for eBooks }
        estimatedDelivery:
          type: object
          description: Tentative delivery estimate shown as a tag on the product
          required: [instant]
          properties:
            instant: { type: boolean, description: True for eBooks }
            date: { type: string, format: date, description: Absent when `instant` is true }

    BookPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Book' }

    Page:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    ReviewInput:
      type: object
      required: [rating, text]
      additionalProperties: false
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, minLength: 1, maxLength: 100 }

    Review:
      type: object
      required: [id, bookId, authorName, rating, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string }
        authorName: { type: string, example: John Smith }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 100 }
        createdAt: { type: string, format: date-time }

    ReviewPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Review' }

    User:
      type: object
      required: [id, name, email, walletBalance, giftPoints]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        walletBalance: { $ref: '#/components/schemas/Money' }
        giftPoints:
          type: integer
          minimum: 0
          description: Redeemable at 1 RON per point

    AddressInput:
      type: object
      required: [firstName, lastName, line1, email, city, postalCode, phone, county, country]
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        line1: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        city: { type: string, minLength: 1, maxLength: 80 }
        postalCode: { type: string, pattern: '^[0-9]{6}$', example: '010063' }
        phoneCode: { type: string, pattern: '^\+[0-9]{1,4}$', default: '+40' }
        phone:
          type: string
          pattern: '^[0-9]{9}$'
          description: National number without the leading 0
          example: '712345678'
        county: { type: string, minLength: 1, maxLength: 80, example: București }
        country: { type: string, minLength: 1, maxLength: 80, default: Romania }
        isDefault: { type: boolean, default: false }

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }

    CartItem:
      type: object
      required: [book, quantity, lineTotal]
      properties:
        book: { $ref: '#/components/schemas/Book' }
        quantity: { type: integer, minimum: 1, maximum: 10 }
        lineTotal: { $ref: '#/components/schemas/Money' }

    Cart:
      type: object
      required: [items, itemCount, subtotal]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        itemCount: { type: integer, minimum: 0 }
        subtotal: { $ref: '#/components/schemas/Money' }

    QuoteRequest:
      type: object
      additionalProperties: false
      properties:
        couponCode: { type: string, pattern: '^[A-Za-z0-9_-]{3,32}$' }
        redeemGiftPoints:
          type: boolean
          default: false
          description: Redeem as many gift points as the user has, up to the payable amount

    Quote:
      type: object
      required: [subtotal, tax, deliveryCharge, couponDiscount, pointsUsed, pointsDiscount, total]
      properties:
        subtotal: { $ref: '#/components/schemas/Money' }
        tax:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: VAT (TVA) at 11%, the reduced rate for books
        deliveryCharge: { $ref: '#/components/schemas/Money' }
        couponCode: { type: string, description: Present only when the coupon was applied }
        couponDiscount: { $ref: '#/components/schemas/Money' }
        couponError: { type: string, example: Invalid coupon code }
        pointsUsed: { type: integer, minimum: 0 }
        pointsDiscount: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }

    CreateOrderRequest:
      type: object
      required: [shippingAddress]
      additionalProperties: false
      properties:
        shippingAddress:
          oneOf:
            - type: object
              title: Saved address
              required: [addressId]
              additionalProperties: false
              properties:
                addressId: { type: string, format: uuid }
            - type: object
              title: New address
              required: [address]
              additionalProperties: false
              properties:
                address: { $ref: '#/components/schemas/AddressInput' }
                save: { type: boolean, default: false }
        couponCode: { type: string, pattern: '^[A-Za-z0-9_-]{3,32}$' }
        redeemGiftPoints: { type: boolean, default: false }

    OrderStatus:
      type: string
      enum: [pending_payment, placed, delivered, cancelled]

    OrderItem:
      type: object
      required: [bookId, title, quantity, unitPrice]
      properties:
        bookId: { type: string }
        title: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }

    Order:
      type: object
      required: [id, orderNumber, status, items, shippingAddress, subtotal, tax, deliveryCharge, couponDiscount, pointsUsed, pointsDiscount, total, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, pattern: '^BW-[0-9A-F]{10}$', example: BW-3F9A12C0DE }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod:
          allOf:
            - $ref: '#/components/schemas/PaymentMethod'
          description: Method of the payment that placed the order. Absent while the order is `pending_payment`.
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        shippingAddress: { $ref: '#/components/schemas/AddressInput' }
        subtotal: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        deliveryCharge: { $ref: '#/components/schemas/Money' }
        couponCode: { type: string }
        couponDiscount: { $ref: '#/components/schemas/Money' }
        pointsUsed: { type: integer, minimum: 0 }
        pointsDiscount: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        createdAt: { type: string, format: date-time }
        placedAt: { type: string, format: date-time }
        cancellableUntil:
          type: string
          format: date-time
          description: End of the 48-hour cancellation window. Present while the order is `placed`.
        cancelledAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time }
        canCancel:
          type: boolean
          description: Computed by the server at response time

    OrderPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Order' }

    PaymentMethod:
      type: string
      enum: [credit-card, debit-card, cash-on-delivery, wallet]

    PaymentRequest:
      description: |
        Wallet and cash-on-delivery payments take no token. Card payments require a single-use `paymentToken` issued by
        the payment gateway's client SDK. Raw card details must never be sent.
      oneOf:
        - $ref: '#/components/schemas/WalletPaymentRequest'
        - $ref: '#/components/schemas/TokenPaymentRequest'

    WalletPaymentRequest:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [wallet, cash-on-delivery]

    TokenPaymentRequest:
      type: object
      required: [method, paymentToken]
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [credit-card, debit-card]
        paymentToken:
          type: string
          minLength: 8
          maxLength: 512

    Payment:
      type: object
      required: [id, orderId, method, status, amount, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        status:
          type: string
          enum: [initiated, succeeded, failed, refunded]
        amount: { $ref: '#/components/schemas/Money' }
        failureReason: { type: string, description: 'Generic, user-safe reason' }
        createdAt: { type: string, format: date-time }
        order:
          $ref: '#/components/schemas/Order'

    WalletTransaction:
      type: object
      required: [id, reason, amount, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        reason:
          type: string
          enum: [top_up, order_payment, order_refund]
        amount:
          type: number
          multipleOf: 0.01
          description: Positive for credits, negative for debits
        createdAt: { type: string, format: date-time }
